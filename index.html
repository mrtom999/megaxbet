<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ব্রাউজার ট্যাবের টাইটেল, এখানে গিটহাবের কোনো নাম থাকবে না -->
    <title>MegaXbet - Official Gaming & Casino</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --gold: #f3c614;
            --gold-light: #ffeb82;
            --gold-border: rgba(243, 198, 20, 0.3);
            --text-color: #ffffff;
            --text-muted: #9ba1a6;
            --accent-red: #ff3b30;
            --accent-green: #28a745;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        header { background: var(--card-bg); border-bottom: 2px solid var(--gold); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        /* প্রিমিয়াম লোগো ডিজাইন */
        .logo { 
            color: var(--gold); 
            font-size: 26px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            text-shadow: 0 0 10px rgba(243, 198, 20, 0.4);
        }
        .logo-icon {
            background: linear-gradient(135deg, #f3c614, #c99a04);
            color: #0b0e14;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(243, 198, 20, 0.3);
        }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .balance-box { background: #1f2430; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--gold); color: var(--gold-light); font-weight: bold; font-size: 14px; display: none; }
        .auth-btns button { padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-login:hover { background: var(--gold); color: #0b0e14; }
        .btn-signup { background: var(--gold); border: none; color: #0b0e14; }
        .btn-signup:hover { opacity: 0.9; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .section-title { color: var(--gold); border-bottom: 1px solid #222632; padding-bottom: 10px; margin: 30px 0 20px; font-size: 20px; }

        /* সদস্য সেন্টার */
        .member-center-box { background: var(--card-bg); border: 1px solid #222632; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .member-title { background: rgba(243, 198, 20, 0.1); color: var(--gold); padding: 8px 15px; border-radius: 6px; font-size: 15px; font-weight: bold; display: inline-block; margin-bottom: 20px; border: 1px solid var(--gold-border); }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; text-align: center; }
        .icon-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .icon-item:hover { transform: translateY(-3px); }
        .icon-circle { width: 60px; height: 60px; background: linear-gradient(135deg, #252a36, #1a1e29); border: 1px solid var(--gold-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--gold); margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; }
        .icon-item span { font-size: 13px; color: var(--text-color); font-weight: 500; }

        /* Aviator Banner */
        .aviator-banner { background: linear-gradient(135deg, #1c1402, #2d2204, #121008); border: 2px solid var(--gold); border-radius: 12px; padding: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 8px 25px rgba(243, 198, 20, 0.15); }
        .aviator-info h2 { color: var(--gold); margin: 0 0 10px; font-size: 28px; }
        .aviator-info p { color: var(--text-muted); margin: 0 0 15px; font-size: 14px; }
        .play-now-btn { background: linear-gradient(135deg, #f3c614, #c99a04); color: #0b0e14; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .play-now-btn:hover { transform: scale(1.05); }

        /* High-Quality Game Grid & Casino Card Styling */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .game-card { background: linear-gradient(145deg, #181c25, #12151c); border: 1px solid rgba(243, 198, 20, 0.2); border-radius: 12px; overflow: hidden; text-align: center; transition: all 0.3s ease; box-shadow: 0 6px 15px rgba(0,0,0,0.4); position: relative; }
        .game-card:hover { border-color: var(--gold); transform: translateY(-6px); box-shadow: 0 10px 25px rgba(243, 198, 20, 0.25); }
        .game-thumb-container { position: relative; width: 100%; height: 140px; overflow: hidden; background: #000; }
        .game-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .game-card:hover img { transform: scale(1.1); }
        .game-badge { position: absolute; top: 8px; left: 8px; background: var(--gold); color: #0b0e14; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; z-index: 2; }
        .game-info { padding: 12px; }
        .game-card h4 { font-size: 15px; margin: 0 0 10px; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-btn { background: linear-gradient(135deg, #f3c614, #c99a04); color: #0b0e14; border: none; padding: 8px 15px; font-weight: bold; font-size: 13px; border-radius: 6px; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .play-btn:hover { opacity: 0.9; filter: brightness(1.1); }

        /* Finance Grid */
        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px) { .finance-grid { grid-template-columns: 1fr; } }
        .form-box { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #222632; }
        .form-box h3 { color: var(--gold); margin-top: 0; margin-bottom: 15px; font-size: 18px; }
        .form-box input, .form-box select { width: 100%; padding: 10px; margin: 8px 0; background: #0b0e14; border: 1px solid #333946; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .form-box button { background: var(--gold); color: #0b0e14; font-weight: bold; border: none; width: 100%; padding: 11px; border-radius: 5px; cursor: pointer; margin-top: 8px; }

        /* History Tables */
        .history-box { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #222632; margin-bottom: 50px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #222632; font-size: 14px; }
        th { background: #1f2430; color: var(--gold); }
        .status-approved { color: var(--accent-green); font-weight: bold; }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-rejected { color: var(--accent-red); font-weight: bold; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .auth-box { background: var(--card-bg); border: 2px solid var(--gold); padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; position: relative; }
        .auth-box h3 { color: var(--gold); margin-top: 0; text-align: center; }
        .auth-box input { width: 100%; padding: 10px; margin: 10px 0; background: #0b0e14; border: 1px solid #333946; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .auth-box button.submit-btn { background: var(--gold); color: #0b0e14; font-weight: bold; border: none; width: 100%; padding: 11px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .close-modal { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <!-- প্রিমিয়াম লোগো সেকশন -->
        <div class="logo">
            <div class="logo-icon">⚡</div>
            MegaXbet
        </div>
        <div class="header-right">
            <div class="balance-box" id="balance-container">Balance: <span id="user-balance">0.00</span> BDT</div>
            <div class="auth-btns" id="auth-buttons">
                <button class="btn-login" onclick="openLoginModal()">লগইন</button>
                <button class="btn-signup" onclick="openSignupModal()">সাইন আপ</button>
            </div>
            <div id="user-profile-display" style="display: none; color: var(--gold); font-weight: bold;">
                👤 <span id="logged-username"></span> | <a href="#" onclick="logout()" style="color: var(--accent-red); font-size: 13px; text-decoration: none;">লগআউট</a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- সদস্য সেন্টার -->
        <div class="member-center-box">

                <div class="icon-item" onclick="loadUserHistory()"><div class="icon-circle">📑</div><span>লেনদেনের ইতিহাস</span></div>

                <div class="icon-item" onclick="logout()"><div class="icon-circle" style="color: var(--accent-red);">🚪</div><span>লগআউট</span></div>
            </div>
        </div>

        <!-- Aviator Banner -->
        <div class="aviator-banner">
            <div class="aviator-info">
                <h2>🚀 AVIATOR (মাস্ট-হেট গেম)</h2>
                <p>সবচেয়ে রোমাঞ্চকর ক্র্যাশ গেম। এখনই খেলুন এবং আপনার ভাগ্য পরীক্ষা করুন!</p>
                <button class="play-now-btn" onclick="alert('খেলা শুরু করতে লগইন করে ডিপোজিট করুন')">এখনই খেলুন</button>
            </div>
        </div>

        <!-- High-End Casino Games Section -->
        <h2 class="section-title">🎰 প্রিমিয়াম স্লট ও লাইভ ক্যাসিনো</h2>
        <div class="game-grid"
